<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCalculator</title>
    <link rel="stylesheet" href="./style.css"/>
</head>
<body>
    <div class="screen">
        <div class="calculator-box">
            <div class="calci-screen"><h2 class="values"></h2></div>
            <div class="numpad">
                <div class="numpad-item history">(</div>
                <div class="numpad-item power">^²</div>
                <div class="numpad-item backspace">⌫</div>
                <div class="numpad-item openbrace">(</div>
                <div class="numpad-item closebrace">)</div>
                <div class="numpad-item history">⏱</div>
                <div class="numpad-item one">1</div>
                <div class="numpad-item two">2</div>
                <div class="numpad-item three">3</div>
                <div class="numpad-item four">4</div>
                <div class="numpad-item five">5</div>
                <div class="numpad-item six">6</div>
                <div class="numpad-item seven">7</div>
                <div class="numpad-item eight">8</div>
                <div class="numpad-item nine">9</div>
                <div class="numpad-item mod">%</div>
                <div class="numpad-item 0">0</div>
                <div class="numpad-item dot">.</div>
            </div>
            <div class="operators">
                <div class="operators-item clear">C</div>
                <div class="operators-item plus">+</div>
                <div class="operators-item minus">-</div>
                <div class="operators-item multiple">*</div>
                <div class="operators-item divide">/</div>
                <div class="operators-item equal">=</div>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
